<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Menu Item</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --accent: #8b5cf6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --background: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --input-bg: rgba(15, 23, 42, 0.6);
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.1);
            --nav-height: 70px;
            --footer-height: 60px;
        }
        
        /* Light Theme Variables */
        [data-theme="light"] {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --secondary: #10b981;
            --secondary-hover: #059669;
            --accent: #8b5cf6;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --background: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.8);
            --input-bg: rgba(255, 255, 255, 0.8);
            --text: #1e293b;
            --text-secondary: #64748b;
            --border: rgba(203, 213, 225, 0.3);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--background);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 30%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* Navigation */
        .navbar {
            height: var(--nav-height);
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        [data-theme="light"] .navbar {
            background: rgba(255, 255, 255, 0.8);
        }
        
        .navbar::before {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent, 
                var(--primary), 
                var(--accent), 
                transparent
            );
            opacity: 0.7;
        }
        
        .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            text-decoration: none;
            letter-spacing: 1px;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .navbar-brand::before {
            content: "";
            display: inline-block;
            width: 12px;
            height: 12px;
            background: var(--secondary);
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 10px var(--secondary);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        
        /* Theme Toggle */
        .theme-toggle {
            margin-right: 1.5rem;
            position: relative;
            z-index: 100;
        }

        #theme-toggle-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        #theme-toggle-btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: -1;
        }

        #theme-toggle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #theme-toggle-btn:hover::before {
            opacity: 0.2;
        }

        .theme-icon {
            position: absolute;
            transition: all 0.3s ease;
        }

        .sun-icon {
            opacity: 0;
            transform: scale(0.5);
        }

        .moon-icon {
            opacity: 1;
            transform: scale(1);
        }

        [data-theme="light"] .sun-icon {
            opacity: 1;
            transform: scale(1);
        }

        [data-theme="light"] .moon-icon {
            opacity: 0;
            transform: scale(0.5);
        }
        
        .btn-outline-danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .btn-outline-danger:hover {
            background-color: var(--danger);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }
        
        /* Container */
        .container {
            flex: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: calc(100vh - var(--nav-height) - var(--footer-height));
        }
        
        /* Form Header */
        h2 {
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 1.5rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.75rem;
        }
        
        h2::after {
            content: "";
            height: 3px;
            flex-grow: 1;
            background: linear-gradient(90deg, var(--primary), transparent);
            margin-left: 15px;
        }
        
        /* Form Container */
        .form-container {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            padding: 2.5rem;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.6s ease-out;
            max-width: 600px;
            margin: 0 auto;
        }
        
        .form-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
        
        /* Form Group */
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text);
            font-size: 0.95rem;
        }
        
        .form-control {
            width: 100%;
            padding: 0.875rem 1rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
        }
        
        .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
        }
        
        /* Input with icon */
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            pointer-events: none;
            transition: color 0.3s ease;
        }
        
        .input-wrapper .form-control {
            padding-left: 2.75rem;
        }
        
        .input-wrapper .form-control:focus + .input-icon {
            color: var(--primary);
        }
        
        /* Buttons */
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            position: relative;
            overflow: hidden;
            border: none;
            cursor: pointer;
        }
        
        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn-primary {
            background-color: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background-color: var(--primary-hover);
        }
        
        .btn-secondary {
            background-color: var(--text-secondary);
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: var(--text);
        }
        
        .ms-2 {
            margin-left: 0.5rem;
        }
        
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            .navbar {
                padding: 0 1.5rem;
            }
            
            .container {
                padding: 1.5rem;
            }
            
            .form-container {
                padding: 2rem 1.5rem;
            }
            
            .btn {
                width: 100%;
                margin-bottom: 0.5rem;
            }
            
            .ms-2 {
                margin-left: 0;
            }
        }
        
        /* Theme Transition */
        .theme-transition {
            transition: background-color 0.5s ease, color 0.5s ease;
        }

        .theme-transition * {
            transition: background-color 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        
        /* Button Container */
        .button-container {
            display: flex;
            gap: 0.5rem;
            margin-top: 2rem;
        }
        
        @media (max-width: 768px) {
            .button-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h2>Add New Menu Item</h2>
    <form action="{{ url_for('menu_add') }}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Item Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="category_id" class="form-label">Category</label>
            <select class="form-select" id="category_id" name="category_id" required>
                <option value="" disabled selected>Select category</option>
                {% for category in categories %}
                <option value="{{ category[0] }}">{{ category[1] }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Price (₹)</label>
            <input type="number" step="0.01" class="form-control" id="price" name="price" required>
        </div>
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="is_available" name="is_available" value="1" checked>
            <label class="form-check-label" for="is_available">Available</label>
        </div>
        <button type="submit" class="btn btn-primary">Add Item</button>
        <a href="{{ url_for('menu_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
</body>
</html>

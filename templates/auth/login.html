{% extends "base.html" %}

{% block title %}Login - Restaurant Management System{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-container">
        <div class="login-header">
            <div class="logo-pulse"></div>
            <h2>System Access</h2>
        </div>
        
        <form method="post" action="{{ url_for('login') }}" class="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" required autocomplete="username">
                    <span class="focus-border"></span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                    <span class="focus-border"></span>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <span class="eye-icon">👁️</span>
                    </button>
                </div>
            </div>
            
            <button type="submit" class="btn-primary">
                <span class="btn-text">Login</span>
                <span class="btn-icon">→</span>
            </button>
        </form>
    </div>
</div>

<style>
    :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --secondary: #10b981;
        --accent: #8b5cf6;
        --background: #0f172a;
        --card-bg: rgba(30, 41, 59, 0.7);
        --text: #e2e8f0;
        --text-secondary: #94a3b8;
        --border: rgba(148, 163, 184, 0.1);
        --input-bg: rgba(15, 23, 42, 0.6);
        --error: #ef4444;
    }
    
    .login-page {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Roboto', sans-serif;
        background-color: var(--background);
        background-image: 
            radial-gradient(circle at 20% 30%, rgba(79, 70, 229, 0.15) 0%, transparent 30%),
            radial-gradient(circle at 80% 70%, rgba(139, 92, 246, 0.1) 0%, transparent 30%);
        color: var(--text);
        padding: 2rem;
    }
    
    .login-container {
        width: 100%;
        max-width: 420px;
        background: var(--card-bg);
        border-radius: 16px;
        border: 1px solid var(--border);
        padding: 2.5rem;
        backdrop-filter: blur(10px);
        box-shadow: 
            0 25px 50px -12px rgba(0, 0, 0, 0.25),
            0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        position: relative;
        overflow: hidden;
        animation: fadeIn 0.6s ease-out;
    }
    
    .login-container::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
    }
    
    .login-header {
        text-align: center;
        margin-bottom: 2.5rem;
        position: relative;
    }
    
    .logo-pulse {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        margin: 0 auto 1.5rem;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .logo-pulse::before {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        opacity: 0.7;
        animation: pulse 2s infinite;
    }
    
    .logo-pulse::after {
        content: "🍽️";
        font-size: 24px;
        position: relative;
        z-index: 2;
    }
    
    @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        50% { transform: scale(1.2); opacity: 0; }
        100% { transform: scale(1); opacity: 0; }
    }
    
    .login-header h2 {
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        font-size: 1.75rem;
        color: var(--text);
        margin: 0;
        letter-spacing: 1px;
    }
    
    .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }
    
    .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    
    .form-group label {
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--text-secondary);
        margin-left: 0.25rem;
    }
    
    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    
    .input-icon {
        position: absolute;
        left: 1rem;
        font-size: 1rem;
        color: var(--text-secondary);
        pointer-events: none;
        transition: color 0.3s ease;
    }
    
    .input-wrapper input {
        width: 100%;
        padding: 0.875rem 1rem 0.875rem 2.75rem;
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-size: 1rem;
        transition: all 0.3s ease;
        outline: none;
    }
    
    .input-wrapper input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.2);
    }
    
    .input-wrapper input:focus + .focus-border {
        transform: scaleX(1);
    }
    
    .input-wrapper input:focus ~ .input-icon {
        color: var(--primary);
    }
    
    .focus-border {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), var(--accent));
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease;
        border-radius: 0 0 8px 8px;
    }
    
    .toggle-password {
        position: absolute;
        right: 1rem;
        background: none;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 0;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: color 0.3s ease;
    }
    
    .toggle-password:hover {
        color: var(--text);
    }
    
    .btn-primary {
        background: linear-gradient(90deg, var(--primary), var(--primary-hover));
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.875rem 1.5rem;
        font-weight: 500;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        position: relative;
        overflow: hidden;
        margin-top: 0.5rem;
    }
    
    .btn-primary::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s ease;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
    }
    
    .btn-primary:hover::before {
        left: 100%;
    }
    
    .btn-icon {
        font-size: 1.25rem;
        transition: transform 0.3s ease;
    }
    
    .btn-primary:hover .btn-icon {
        transform: translateX(4px);
    }
    
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 480px) {
        .login-container {
            padding: 2rem 1.5rem;
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Password visibility toggle
        const togglePassword = document.querySelector('.toggle-password');
        const passwordInput = document.querySelector('#password');
        
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Change the eye icon
                const eyeIcon = this.querySelector('.eye-icon');
                eyeIcon.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
            });
        }
        
        // Add floating label effect
        const inputs = document.querySelectorAll('.input-wrapper input');
        
        inputs.forEach(input => {
            // Check if input has value on load
            if (input.value) {
                input.classList.add('has-value');
            }
            
            // Add focus animation
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
                if (this.value) {
                    this.classList.add('has-value');
                } else {
                    this.classList.remove('has-value');
                }
            });
        });
        
        // Add subtle background animation
        const loginPage = document.querySelector('.login-page');
        if (loginPage) {
            loginPage.addEventListener('mousemove', function(e) {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                loginPage.style.backgroundPosition = `${x * 100}% ${y * 100}%`;
            });
        }
    });
</script>
{% endblock %}
